<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in | Recover</title>
    <link rel="icon" type="image/x-icon" href="faviconV2.png">
    <style>
        /* Remove default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Make iframe take up the entire viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* Prevents small inline gaps at the bottom */
        }
    </style>
</head>
<body>

    <iframe src="login.html" title="Recover Page"></iframe>

</body>
</html>
